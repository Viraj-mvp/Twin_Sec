<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="favicon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hazard Stripes for Physical Block -->
    <pattern id="fav-hazard" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1.2" height="3" fill="#bfff2e" opacity="0.35" />
      <rect x="1.2" width="1.8" height="3" fill="none" />
    </pattern>
  </defs>

  <!-- Radar Grid Target rings (Subtle background details) -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#bfff2e" stroke-width="0.5" opacity="0.12" stroke-dasharray="1 2" />
  <circle cx="16" cy="16" r="10" fill="none" stroke="#bfff2e" stroke-width="0.5" opacity="0.08" />

  <!-- Tactical Reticle Ticks -->
  <path d="M16 1 L16 3 M16 29 L16 31 M1 16 L3 16 M29 16 L31 16" stroke="#bfff2e" stroke-width="0.75" opacity="0.3" stroke-linecap="round" />

  <!-- CUBE 2: PHYSICAL FACILITY (Solid Block - Bottom-Right) -->
  <g opacity="0.85">
    <!-- Left Face -->
    <path d="M 13.8 15 L 19 18 L 19 24 L 13.8 21 Z" fill="#181c12" stroke="#bfff2e" stroke-width="0.5" opacity="0.9" />
    <!-- Right Face -->
    <path d="M 19 18 L 24.2 15 L 24.2 21 L 19 24 Z" fill="#1e2417" stroke="#bfff2e" stroke-width="0.5" opacity="0.9" />
    <!-- Top Face -->
    <path d="M 19 12 L 24.2 15 L 19 18 L 13.8 15 Z" fill="#14180f" stroke="#bfff2e" stroke-width="0.5" />
    <path d="M 19 12 L 24.2 15 L 19 18 L 13.8 15 Z" fill="url(#fav-hazard)" />
  </g>

  <!-- Cyber-Physical Link -->
  <path d="M 13 14 L 19 18" stroke="#bfff2e" stroke-width="0.75" stroke-dasharray="1 1.5" opacity="0.6" />

  <!-- CUBE 1: DIGITAL TWIN (Wireframe Block - Top-Left) -->
  <g stroke="#bfff2e" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Edges -->
    <line x1="13" y1="8" x2="13" y2="14" />
    <line x1="7.8" y1="11" x2="7.8" y2="17" />
    <line x1="18.2" y1="11" x2="18.2" y2="17" />
    <line x1="13" y1="14" x2="13" y2="20" />

    {/* Top Face Edges */}
    <line x1="13" y1="8" x2="7.8" y2="11" />
    <line x1="13" y1="8" x2="18.2" y2="11" />
    <line x1="7.8" y1="11" x2="13" y2="14" />
    <line x1="18.2" y1="11" x2="13" y2="14" />

    {/* Bottom Face Edges */}
    <line x1="13" y1="14" x2="7.8" y2="17" />
    <line x1="13" y1="14" x2="18.2" y2="17" />
    <line x1="7.8" y1="17" x2="13" y2="20" />
    <line x1="18.2" y1="17" x2="13" y2="20" />
  </g>

  <!-- Digital Twin Node Dots -->
  <circle cx="13" cy="8" r="0.5" fill="#bfff2e" />
  <circle cx="7.8" cy="11" r="0.5" fill="#bfff2e" />
  <circle cx="18.2" cy="11" r="0.5" fill="#bfff2e" />
  <circle cx="7.8" cy="17" r="0.5" fill="#bfff2e" />
  <circle cx="18.2" cy="17" r="0.5" fill="#bfff2e" />
  <circle cx="13" cy="20" r="0.5" fill="#bfff2e" />

  <!-- Compromised Target Central Node (Glowing) -->
  <circle cx="13" cy="14" r="2.2" fill="#bfff2e" filter="url(#favicon-glow)">
    <animate attributeName="r" values="1.8;2.6;1.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
