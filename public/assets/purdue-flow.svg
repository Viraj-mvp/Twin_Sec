<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dash-flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes breach-flicker {
        0%, 100% { stroke: #ff4d4d; opacity: 1; }
        50% { stroke: #ff9999; opacity: 0.6; }
      }
      @keyframes airgap-pulse {
        0%, 100% { stroke: #00f0ff; opacity: 1; filter: drop-shadow(0 0 4px #00f0ff); }
        50% { stroke: #0088aa; opacity: 0.5; filter: drop-shadow(0 0 0px #00f0ff); }
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      .flow-nominal {
        stroke-dasharray: 6 6;
        animation: dash-flow 1.5s linear infinite;
      }
      .flow-breached {
        stroke-dasharray: 4 4;
        animation: dash-flow 0.6s linear infinite, breach-flicker 0.4s infinite;
      }
      .airgap-barrier {
        animation: airgap-pulse 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="940" height="180" fill="#0d0e12" stroke="#222530" stroke-width="2" />

  <!-- Flow Lines Connecting Layers -->
  <!-- Nominal IT Flow (L4 -> L3.5) -->
  <line x1="140" y1="90" x2="220" y2="90" stroke="#BFFF2E" stroke-width="3" class="flow-nominal" />
  
  <!-- Breached Lateral Movement (L3.5 -> L2) -->
  <line x1="330" y1="90" x2="410" y2="90" stroke="#ff4d4d" stroke-width="3" class="flow-breached" />

  <!-- Severed Air-Gap Boundary between L2 and L1 -->
  <line x1="520" y1="90" x2="600" y2="90" stroke="#323846" stroke-width="2" stroke-dasharray="2 4" />
  <!-- Diagonal Severance Indicator -->
  <line x1="550" y1="65" x2="570" y2="115" stroke="#00f0ff" stroke-width="3" class="airgap-barrier" />
  <line x1="570" y1="65" x2="550" y2="115" stroke="#00f0ff" stroke-width="3" class="airgap-barrier" />

  <!-- Protected Nominal Flow (L1 -> L0) -->
  <line x1="710" y1="90" x2="790" y2="90" stroke="#BFFF2E" stroke-width="3" class="flow-nominal" />

  <!-- LEVEL 4: Enterprise Workstation -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="110" height="90" fill="#151720" stroke="#323846" stroke-width="2" />
    <rect x="0" y="0" width="110" height="20" fill="#202432" />
    <text x="55" y="14" fill="#BFFF2E" class="font-mono" font-size="8.5" font-weight="700" text-anchor="middle">LEVEL 4 · IT/EWS</text>
    <text x="55" y="48" fill="#F5F3E7" class="font-mono" font-size="12" font-weight="800" text-anchor="middle">EWS-04</text>
    <text x="55" y="66" fill="#8892a4" class="font-mono" font-size="8" text-anchor="middle">Engineering Stn</text>
    <rect x="15" y="76" width="80" height="10" fill="#252936" />
    <text x="55" y="84" fill="#BFFF2E" class="font-mono" font-size="6.5" font-weight="700" text-anchor="middle">INITIAL ACCESS</text>
  </g>

  <!-- LEVEL 3.5: Historian & DMZ -->
  <g transform="translate(220, 45)">
    <rect x="0" y="0" width="110" height="90" fill="#151720" stroke="#ff4d4d" stroke-width="2" />
    <rect x="0" y="0" width="110" height="20" fill="#3a1515" />
    <text x="55" y="14" fill="#ff4d4d" class="font-mono" font-size="8.5" font-weight="700" text-anchor="middle">LEVEL 3 · DMZ</text>
    <text x="55" y="48" fill="#F5F3E7" class="font-mono" font-size="12" font-weight="800" text-anchor="middle">HIST-PI</text>
    <text x="55" y="66" fill="#ff9999" class="font-mono" font-size="8" text-anchor="middle">SCADA Historian</text>
    <rect x="15" y="76" width="80" height="10" fill="#3a1515" />
    <text x="55" y="84" fill="#ff4d4d" class="font-mono" font-size="6.5" font-weight="700" text-anchor="middle">COMPROMISED</text>
  </g>

  <!-- LEVEL 2: OT Switch & HMI -->
  <g transform="translate(410, 45)">
    <rect x="0" y="0" width="110" height="90" fill="#151720" stroke="#ff4d4d" stroke-width="2" />
    <rect x="0" y="0" width="110" height="20" fill="#3a1515" />
    <text x="55" y="14" fill="#ff4d4d" class="font-mono" font-size="8.5" font-weight="700" text-anchor="middle">LEVEL 2 · OT NET</text>
    <text x="55" y="48" fill="#F5F3E7" class="font-mono" font-size="12" font-weight="800" text-anchor="middle">SW-A / HMI</text>
    <text x="55" y="66" fill="#ff9999" class="font-mono" font-size="8" text-anchor="middle">Hirschmann RSP</text>
    <rect x="15" y="76" width="80" height="10" fill="#3a1515" />
    <text x="55" y="84" fill="#ff4d4d" class="font-mono" font-size="6.5" font-weight="700" text-anchor="middle">TRAVERSAL</text>
  </g>

  <!-- Air-Gap Badge Marker -->
  <g transform="translate(560, 20)">
    <rect x="-45" y="0" width="90" height="18" fill="#003344" stroke="#00f0ff" stroke-width="1.5" />
    <text x="0" y="12" fill="#00f0ff" class="font-mono" font-size="8" font-weight="800" text-anchor="middle">AIR-GAP SEVER</text>
  </g>

  <!-- LEVEL 1: Protected PLC Controllers -->
  <g transform="translate(600, 45)">
    <rect x="0" y="0" width="110" height="90" fill="#111814" stroke="#00f0ff" stroke-width="2" />
    <rect x="0" y="0" width="110" height="20" fill="#003344" />
    <text x="55" y="14" fill="#00f0ff" class="font-mono" font-size="8.5" font-weight="700" text-anchor="middle">LEVEL 1 · CONTROL</text>
    <text x="55" y="48" fill="#F5F3E7" class="font-mono" font-size="12" font-weight="800" text-anchor="middle">PLC-3 / S7</text>
    <text x="55" y="66" fill="#88ddff" class="font-mono" font-size="8" text-anchor="middle">Process Controller</text>
    <rect x="15" y="76" width="80" height="10" fill="#003344" />
    <text x="55" y="84" fill="#00f0ff" class="font-mono" font-size="6.5" font-weight="700" text-anchor="middle">ISOLATED/SHIELDED</text>
  </g>

  <!-- LEVEL 0: Physical Field Actuators -->
  <g transform="translate(790, 45)">
    <rect x="0" y="0" width="120" height="90" fill="#111814" stroke="#BFFF2E" stroke-width="2" />
    <rect x="0" y="0" width="120" height="20" fill="#1f2d08" />
    <text x="60" y="14" fill="#BFFF2E" class="font-mono" font-size="8.5" font-weight="700" text-anchor="middle">LEVEL 0 · PHYSICAL</text>
    <text x="60" y="48" fill="#F5F3E7" class="font-mono" font-size="12" font-weight="800" text-anchor="middle">TURBINE / BRK</text>
    <text x="60" y="66" fill="#BFFF2E" class="font-mono" font-size="8" text-anchor="middle">Centrifuge 14MW</text>
    <rect x="15" y="76" width="90" height="10" fill="#1f2d08" />
    <text x="60" y="84" fill="#BFFF2E" class="font-mono" font-size="6.5" font-weight="700" text-anchor="middle">0 MW LOAD SHED</text>
  </g>
</svg>
