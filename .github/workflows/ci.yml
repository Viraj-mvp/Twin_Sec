name: TwinSec CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "twinsec-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Type Validation
        run: npx tsc --noEmit

      - name: ESLint Code Quality
        run: npm run lint

      - name: Execute Full Test Suite
        run: npm test

      - name: Compile Production Build Artifacts
        run: npm run build
